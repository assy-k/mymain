name: Back To Windows

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest 
    timeout-minutes: 360 

    steps:
      - name: Force Hifh Performance Profile with CPU Parking Disabled
        run: |
          # Activate Windows High Performance Power Profile
          powercfg /setactive SCHEME_MIN
          
          # Minimun and Maximum state of CPU processing locked at 100%
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100

          # Disable core parking
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMINCORES 100

          # Activate
          powercfg /setactive SCHEME_CURRENT

          # Priority on foreground applications
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 26 -Force
  
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $password = "helloW0rld*"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "gopher" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "gopher"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "gopher"
          
          if (-not (Get-LocalUser -Name "gopher")) {
              Write-Error "Erro ao criar o usuário do RDP"
              exit 1
          }

      - name: Install Brave Browser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
      
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/brave/brave-browser/releases/latest" `
            -Headers @{
              "User-Agent" = "GitHub-Actions"
            }
      
          $version = $release.tag_name
          $braveUrl = "https://github.com/brave/brave-browser/releases/download/$version/BraveBrowserSetup.exe"
          $installerPath = "$env:TEMP\brave.exe"
      
          Write-Host "Latest Brave: $version"
          Write-Host "Downloading: $braveUrl"
      
          Invoke-WebRequest `
            -Uri $braveUrl `
            -OutFile $installerPath
      
          Write-Host "Installing..."
      
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/silent", "/install" `
            -Wait `
            -PassThru
      
          if ($process.ExitCode -ne 0) {
            throw "Brave installer failed with exit code $($process.ExitCode)."
          }
      
          Remove-Item $installerPath -Force
      
          $brave = Get-ChildItem `
            -Path @(
              "$env:LOCALAPPDATA\BraveSoftware",
              "$env:ProgramFiles\BraveSoftware",
              "${env:ProgramFiles(x86)}\BraveSoftware"
            ) `
            -Filter "brave.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
      
          if (-not $brave) {
            throw "Brave was not found after installation."
          }
      
          Write-Host "Brave installed: $($brave.VersionInfo.ProductVersion)"
          Write-Host "Path: $($brave.FullName)"



      - name: Install Mullvad Browser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
      
          # Get latest stable Mullvad Browser release
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/mullvad/mullvad-browser/releases/latest" `
            -Headers @{
              "Accept" = "application/vnd.github+json"
              "User-Agent" = "GitHub-Actions"
            }
      
          $version = $release.tag_name
      
          if (-not $version) {
            throw "Could not determine latest Mullvad Browser version."
          }
      
          $assetName = "mullvad-browser-windows-x86_64-$version.exe"
      
          $asset = $release.assets |
            Where-Object { $_.name -eq $assetName } |
            Select-Object -First 1
      
          if (-not $asset) {
            throw "Could not find Windows installer: $assetName"
          }
      
          $downloadUrl = $asset.browser_download_url
          $installerPath = "$env:TEMP\mullvad-browser.exe"
      
          Write-Host "Latest Mullvad Browser: $version"
          Write-Host "Downloading: $downloadUrl"
      
          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $installerPath
      
          if (-not (Test-Path $installerPath)) {
            throw "Mullvad Browser installer was not downloaded."
          }
      
          Write-Host "Installing Mullvad Browser silently..."
      
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
      
          if ($process.ExitCode -ne 0) {
            throw "Mullvad Browser installer failed with exit code $($process.ExitCode)."
          }
      
          Remove-Item $installerPath -Force
      
          # Standard installation location
          $browser = Get-ChildItem `
            -Path "$env:LOCALAPPDATA\Mullvad" `
            -Filter "mullvadbrowser.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
      
          if (-not $browser) {
            throw "Mullvad Browser was not found after installation."
          }
      
          $installedVersion = $browser.VersionInfo.ProductVersion
      
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Mullvad Browser installed successfully"
          Write-Host "Release: $version"
          Write-Host "Version: $installedVersion"
          Write-Host "Path:    $($browser.FullName)"
          Write-Host "=========================================="




    

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=================================================="
          Write-Host "CONECTE VIA SEU CLIENTE RDP UTILIZANDO O TAILSCALE:"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: gopher"
          Write-Host "Password: helloW0rld*"
          Write-Host "==================================================`n"
          
          # Mantém a sessão ativa de forma estável por até 5.8 horas (350 minutos)
          $endTime = (Get-Date).AddMinutes(350)
          do {
              Write-Host "[$(Get-Date)] Sessão RDP online e operando..."
              Start-Sleep -Seconds 120
          } while ((Get-Date) -lt $endTime)
