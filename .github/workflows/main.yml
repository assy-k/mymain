name: Back To Windows

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest 
    timeout-minutes: 360 

    steps:
      - name: Force Maximum 4-Core CPU Performance
        run: |
          
          # Activate Windows High Performance Power Profile
          powercfg /setactive SCHEME_MIN
          
          # Minimun and Maximum state of CPU processing locked at 100%
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100

          # Disable core parking
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMINCORES 100

          # Activate
          powercfg /setactive SCHEME_CURRENT

          powercfg /query SCHEME_CURRENT SUB_PROCESSOR
           Write-Host "Final CPU settings above."

          # Priority on foreground applications
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 26 -Force
  
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $password = "helloW0rld*"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "gopher" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "gopher"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "gopher"
          
          if (-not (Get-LocalUser -Name "gopher")) {
              Write-Error "Erro ao criar o usuário do RDP"
              exit 1
          }

      - name: Install Brave Browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
      
          $apiUrl = 'https://api.github.com/repos/brave/brave-browser/releases/latest'
          $installer = Join-Path $env:TEMP 'BraveBrowserStandaloneSilentSetup.exe'
      
          Write-Host "Finding latest Brave stable release..."
      
          $release = Invoke-RestMethod `
            -Uri $apiUrl `
            -Headers @{
              'Accept' = 'application/vnd.github+json'
              'User-Agent' = 'GitHub-Actions-Brave-Installer'
            }
      
          $asset = $release.assets |
            Where-Object { $_.name -eq 'BraveBrowserStandaloneSilentSetup.exe' } |
            Select-Object -First 1
      
          if (-not $asset) {
              throw "BraveBrowserStandaloneSilentSetup.exe was not found."
          }
      
          Write-Host "Latest Brave release: $($release.tag_name)"
          Write-Host "Installer: $($asset.name)"
          Write-Host "Download:  $($asset.browser_download_url)"
      
          # ------------------------------------------------------------
          # Download
          # ------------------------------------------------------------
      
          Write-Host "Downloading..."
      
          & curl.exe `
            --fail `
            --location `
            --retry 3 `
            --retry-delay 2 `
            --connect-timeout 30 `
            --max-time 300 `
            --output $installer `
            $asset.browser_download_url
      
          if ($LASTEXITCODE -ne 0) {
              throw "curl failed with exit code $LASTEXITCODE."
          }
      
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Installer was not downloaded."
          }
      
          $file = Get-Item -LiteralPath $installer
      
          if ($file.Length -lt 100KB) {
              throw "Installer is unexpectedly small: $($file.Length) bytes."
          }
      
          Write-Host "Downloaded $($file.Length) bytes."
      
          # ------------------------------------------------------------
          # Verify signature
          # ------------------------------------------------------------
      
          Write-Host "Checking Authenticode signature..."
      
          $signature = Get-AuthenticodeSignature -FilePath $installer
      
          if ($signature.Status -ne 'Valid') {
              throw "Invalid installer signature: $($signature.Status)"
          }
      
          Write-Host "Signature: VALID"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
      
          # ------------------------------------------------------------
          # Install
          # ------------------------------------------------------------
      
          Write-Host "Starting Brave installer..."
      
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/silent', '/install' `
            -PassThru
      
          Write-Host "Installer PID: $($process.Id)"
      
          # Brave may spawn another process and leave the bootstrapper
          # running, so don't wait indefinitely for the original process.
          $timeout = 180
          $elapsed = 0
      
          $bravePaths = @(
              (Join-Path $env:LOCALAPPDATA 'BraveSoftware\Brave-Browser\Application\brave.exe'),
              (Join-Path $env:ProgramFiles 'BraveSoftware\Brave-Browser\Application\brave.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'BraveSoftware\Brave-Browser\Application\brave.exe')
          )
      
          Write-Host "Waiting for Brave installation..."
      
          while ($elapsed -lt $timeout) {
      
              $bravePath = $bravePaths |
                  Where-Object {
                      $_ -and (Test-Path -LiteralPath $_ -PathType Leaf)
                  } |
                  Select-Object -First 1
      
              if ($bravePath) {
                  Write-Host "Brave executable found:"
                  Write-Host "  $bravePath"
                  break
              }
      
              Start-Sleep -Seconds 2
              $elapsed += 2
      
              if (($elapsed % 10) -eq 0) {
                  Write-Host "Still installing... ${elapsed}s elapsed."
              }
          }
      
          # ------------------------------------------------------------
          # Installation timeout
          # ------------------------------------------------------------
      
          if (-not $bravePath) {
      
              Write-Host ""
              Write-Host "Brave was not found after $timeout seconds."
      
              Write-Host ""
              Write-Host "Installer process:"
              Get-Process -Id $process.Id -ErrorAction SilentlyContinue |
                  Format-List Id, ProcessName, Path, CPU, StartTime
      
              Write-Host ""
              Write-Host "Related processes:"
              Get-Process -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_.ProcessName -match 'brave|setup|update'
                  } |
                  Select-Object Id, ProcessName, Path |
                  Format-Table -AutoSize
      
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
      
              throw "Brave installation timed out after $timeout seconds."
          }
      
          # ------------------------------------------------------------
          # Verify version
          # ------------------------------------------------------------
      
          $version = (Get-Item -LiteralPath $bravePath).VersionInfo.ProductVersion
      
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Brave executable exists, but version could not be determined."
          }
      
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Brave Browser installed successfully"
          Write-Host "Release:  $($release.tag_name)"
          Write-Host "Version:  $version"
          Write-Host "Path:     $bravePath"
          Write-Host "=========================================="
      
          # ------------------------------------------------------------
          # Cleanup
          # ------------------------------------------------------------
      
          Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue

    

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=================================================="
          Write-Host "CONECTE VIA SEU CLIENTE RDP UTILIZANDO O TAILSCALE:"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: gopher"
          Write-Host "Password: helloW0rld*"
          Write-Host "==================================================`n"
          
          # Mantém a sessão ativa de forma estável por até 5.8 horas (350 minutos)
          $endTime = (Get-Date).AddMinutes(350)
          do {
              Write-Host "[$(Get-Date)] Sessão RDP online e operando..."
              Start-Sleep -Seconds 120
          } while ((Get-Date) -lt $endTime)
