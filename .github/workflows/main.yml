name: Testing on Ubuntu

on:
  workflow_dispatch:

jobs:
  android-rdp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Instalar Interface Gráfica (GUI), Servidor RDP e Scrcpy
        run: |
          sudo apt-get update
          # Instala ambiente desktop leve, servidor RDP, display virtual e o espelhador de tela (scrcpy)
          sudo apt-get install -y lxde xrdp xvfb cpu-checker android-sdk-platform-tools-common scrcpy
          
          # Define a senha padrão para o usuário 'runner'
          echo "runner:GitHubRDP123" | sudo chpasswd
          
          # Configura o xrdp para carregar corretamente a sessão gráfica do LXDE
          echo "startlxde" > ~/.xsession
          chmod +x ~/.xsession
          
          # Correção de permissão nos certificados locais do RDP para evitar tela preta
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp

      - name: Habilitar Permissões de Virtualização KVM (Para o Android)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Instalar e Iniciar Emulador Android (Com Tradutor ARM)
        run: |
          # 1. Configurar caminhos e variáveis globais do SDK
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME

          echo "Iniciando o display virtual de fundo Xvfb na porta :1..."
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 5
          
          # Força todos os comandos gráficos subsequentes a rodarem dentro do display criado
          export DISPLAY=:1
          
          echo "Aceitando licenças do Android SDK..."
          yes | sdkmanager --licenses || true
          
          echo "Baixando imagem do Android 11 com Google APIs e Tradutor ARM..."
          # Usando a API 30 (Android 11) com google_apis que possui excelente compatibilidade de tradução
          sdkmanager --install "system-images;android-30;google_apis_playstore;x86_64"
          
          echo "Criando o dispositivo virtual (AVD)..."
          echo "" | avdmanager create avd -n test_android -k "system-images;android-30;google_apis_playstore;x86_64" --force
          
          echo "Iniciando a interface gráfica interna..."
          lxsession -s LXDE -e LXDE &
          sleep 5

          echo "Iniciando o Android Emulator..."
          # Iniciando o emulador com suporte a aceleração e tradução binária
          emulator -avd test_android -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot-save -qemu -enable-kvm &
          
          echo "Aguardando o emulador registrar no ADB..."
          sleep 20
          /usr/local/lib/android/sdk/platform-tools/adb wait-for-device || true
          echo "Emulador pronto!"

      - name: Manter Máquina Viva e Monitorar Conexão
        run: |
          echo "=========================================================="
          echo "CONECTE VIA RDP NO SEU CLIENTE USANDO O IP DO TAILSCALE ABAIXO:"
          tailscale ip -4
          echo "Usuário: runner"
          echo "Senha: GitHubRDP123"
          echo "=========================================================="
          
          # Loop em puro Bash para manter o workflow online por 5 horas e meia
          for i in {1..330}; do
              echo "Runner ativo e aguardando conexões via Tailscale... (Minuto $i de 330)"
              sleep 60
          done
