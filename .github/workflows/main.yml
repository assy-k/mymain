name: Testing on Ubuntu

on:
  workflow_dispatch:

jobs:
  android-rdp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Instalar Interface Gráfica (GUI) e Servidor RDP
        run: |
          sudo apt-get update
          # Instala um ambiente desktop super leve (LXDE) e o servidor de RDP (xrdp)
          sudo apt-get install -y lxde xrdp cpu-checker
          
          # Define a senha padrão para o usuário 'gopher' se conectar no RDP
          echo "runner:GitHubRDP123" | sudo chpasswd
          
          # Configura o xrdp para usar o ambiente LXDE instalado
          echo "lxsession -s LXDE -e LXDE" > ~/.xsession
          sudo systemctl restart xrdp

      - name: Habilitar Permissões de Virtualização KVM (Para o Android)
        run: |
          # Libera o acesso direto ao processador para o emulador rodar rápido
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Instalar e Iniciar Emulador Android (Com Tela)
        run: |
          # Instala as ferramentas do Android SDK nativas do Linux
          sudo apt-get install -y android-sdk-platform-tools-common adb

          # Instala o utilitário para gerenciar emuladores de forma simples no Actions
          pip install android-emulator-runner-installer || true
          
          # Cria e inicia um dispositivo virtual Android (AVD) com interface gráfica ativada
          # Nota: O comando roda em segundo plano e SEM a flag '-no-window' para a tela existir no Desktop
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          
          echo "Iniciando o Android Emulator no display virtual..."
          # Aqui o sistema prepara o display virtual x11 para segurar a janela do Android
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          
          # Baixa uma imagem leve do Android 11 (API 30) x86_64 para máxima performance
          sdkmanager --install "system-images;android-30;default;x86_64"
          echo "no" | avdmanager create avd -n test_android -k "system-images;android-30;default;x86_64" --force
          
          # Inicializa o emulador de fato dentro do ambiente virtual gráfico
          emulator -avd test_android -gpu swiftshader_indirect -no-audio -no-boot-anim &

      - name: Manter Máquina Viva e Monitorar Conexão
        run: |
          # Mostra o IP do Tailscale deste runner para você saber onde conectar
          echo "=========================================================="
          echo "CONECTE VIA RDP NO SEU CLIENTE USANDO O IP DO TAILSCALE ABAIXO:"
          tailscale ip -4
          echo "Usuário: gopher"
          echo "Senha: helloW0rld*"
          echo "=========================================================="
          
          # Loop de checagem para manter o workflow online por até 5 horas e meia
          $endTime = (Get-Date).AddMinutes(330)
          $endTimeUnix = [DateTimeOffset]::UtcNow.AddMinutes(330).ToUnixTimeSeconds()
          
          while ($(date +%s) -lt $endTimeUnix) {
              echo "Runner ativo e aguardando conexões via Tailscale..."
              sleep 60
          }
