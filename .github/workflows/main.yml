name: Back To Windows

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest 
    timeout-minutes: 360 

    steps:
      - name: Force Maximum 4-Core CPU Performance
        run: |
          
          # Activate Windows High Performance Power Profile
          powercfg /setactive SCHEME_MIN
          
          # Minimun and Maximum state of CPU processing locked at 100%
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100

          # Disable core parking
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMINCORES 100

          # Activate
          powercfg /setactive SCHEME_CURRENT

          powercfg /query SCHEME_CURRENT SUB_PROCESSOR
           Write-Host "Final CPU settings above."

          # Priority on foreground applications
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\PriorityControl' -Name "Win32PrioritySeparation" -Value 26 -Force
  
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $password = "helloW0rld*"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "gopher" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "gopher"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "gopher"
          
          if (-not (Get-LocalUser -Name "gopher")) {
              Write-Error "Erro ao criar o usuário do RDP"
              exit 1
          }

      - name: Install Brave Browser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
      
          $apiUrl = 'https://api.github.com/repos/brave/brave-browser/releases/latest'
          $installer = Join-Path $env:TEMP 'BraveBrowserSilentSetup.exe'
      
          Write-Host "Finding latest Brave stable release..."
      
          $release = Invoke-RestMethod `
            -Uri $apiUrl `
            -Headers @{
              'Accept' = 'application/vnd.github+json'
              'User-Agent' = 'GitHub-Actions-Brave-Installer'
            }
      
          if (-not $release.tag_name) {
              throw "Unable to determine latest Brave release."
          }
      
          Write-Host "Latest Brave release: $($release.tag_name)"
      
          # Find the Windows x64 silent installer in the official release assets.
          $asset = $release.assets |
            Where-Object {
              $_.name -match '^BraveBrowserStandaloneSilentSetup.*\.exe$' -or
              $_.name -match '^BraveBrowserSilentSetup.*\.exe$'
            } |
            Select-Object -First 1
      
          if (-not $asset) {
              Write-Host "Available Windows installer assets:"
              $release.assets |
                Where-Object { $_.name -match '\.exe$' } |
                ForEach-Object { Write-Host "  $($_.name)" }
      
              throw "Could not find a Brave Windows silent installer in the latest release."
          }
      
          Write-Host "Installer: $($asset.name)"
          Write-Host "Download:  $($asset.browser_download_url)"
      
          # Download
          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $installer `
            -UseBasicParsing
      
          # Verify download
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Brave installer was not downloaded."
          }
      
          $file = Get-Item -LiteralPath $installer
      
          if ($file.Length -lt 100KB) {
              throw "Downloaded installer is unexpectedly small: $($file.Length) bytes"
          }
      
          Write-Host "Downloaded: $($file.Length) bytes"
      
          # Verify Authenticode signature
          Write-Host "Checking Authenticode signature..."
      
          $signature = Get-AuthenticodeSignature -FilePath $installer
      
          if ($signature.Status -ne 'Valid') {
              throw "Brave installer signature is invalid: $($signature.Status)"
          }
      
          Write-Host "Signature: VALID"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
      
          # Install
          Write-Host "Installing Brave silently..."
      
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/silent', '/install' `
            -Wait `
            -PassThru `
            -NoNewWindow
      
          Write-Host "Installer exit code: $($process.ExitCode)"
      
          if ($process.ExitCode -ne 0) {
              throw "Brave installer failed with exit code $($process.ExitCode)."
          }
      
          Start-Sleep -Seconds 2
      
          # Locate Brave
          $braveCandidates = @(
              (Join-Path $env:LOCALAPPDATA 'BraveSoftware\Brave-Browser\Application\brave.exe'),
              (Join-Path $env:ProgramFiles 'BraveSoftware\Brave-Browser\Application\brave.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'BraveSoftware\Brave-Browser\Application\brave.exe')
          )
      
          $bravePath = $braveCandidates |
              Where-Object {
                  $_ -and (Test-Path -LiteralPath $_ -PathType Leaf)
              } |
              Select-Object -First 1
      
          if (-not $bravePath) {
              throw "Installer succeeded, but brave.exe was not found."
          }
      
          # Get installed version
          $versionInfo = (Get-Item -LiteralPath $bravePath).VersionInfo
          $version = $versionInfo.ProductVersion
      
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Brave executable was found, but its version could not be determined."
          }
      
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Brave Browser installed successfully"
          Write-Host "Release:  $($release.tag_name)"
          Write-Host "Version:  $version"
          Write-Host "Path:     $bravePath"
          Write-Host "=========================================="
      
          # Cleanup
          Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=================================================="
          Write-Host "CONECTE VIA SEU CLIENTE RDP UTILIZANDO O TAILSCALE:"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: gopher"
          Write-Host "Password: helloW0rld*"
          Write-Host "==================================================`n"
          
          # Mantém a sessão ativa de forma estável por até 5.8 horas (350 minutos)
          $endTime = (Get-Date).AddMinutes(350)
          do {
              Write-Host "[$(Get-Date)] Sessão RDP online e operando..."
              Start-Sleep -Seconds 120
          } while ((Get-Date) -lt $endTime)
