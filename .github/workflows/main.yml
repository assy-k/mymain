name: Testing on Ubuntu

on:
  workflow_dispatch:

jobs:
  android-rdp-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Instalar Interface Gráfica (GUI) e Servidor RDP
        run: |
          sudo apt-get update
          # Instala um ambiente desktop super leve (LXDE) e o servidor de RDP (xrdp)
          sudo apt-get install -y lxde xrdp cpu-checker
          
          # Define a senha padrão para o usuário 'gopher' se conectar no RDP
          echo "runner:GitHubRDP123" | sudo chpasswd
          
          # Configura o xrdp para usar o ambiente LXDE instalado
          echo "lxsession -s LXDE -e LXDE" > ~/.xsession
          sudo systemctl restart xrdp

      - name: Habilitar Permissões de Virtualização KVM (Para o Android)
        run: |
          # Libera o acesso direto ao processador para o emulador rodar rápido
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Instalar e Iniciar Emulador Android (Com Tela)
        run: |
          # 1. Configurar caminhos e variáveis globais
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator
          
          # Forçar o diretório de AVDs para a home do usuário atual
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME

          # 2. Instalar dependências necessárias do sistema
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils xvfb android-sdk-platform-tools-common
          
          echo "Iniciando o display virtual Xvfb..."
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 5
          
          echo "Aceitando licenças do Android SDK..."
          yes | sdkmanager --licenses || true
          
          echo "Baixando imagem do Android 11..."
          sdkmanager --install "system-images;android-30;default;x86_64"
          
          echo "Criando o dispositivo virtual (AVD) de forma totalmente automatizada..."
          # O truque abaixo envia um 'Enter' vazio para TODAS as perguntas do avdmanager, pulando o prompt de profile customizado
          echo "" | avdmanager create avd -n test_android -k "system-images;android-30;default;x86_64" --force
          
          echo "Verificando se o AVD foi criado com sucesso:"
          emulator -list-avds
          
          echo "Iniciando o Android Emulator em background..."
          # Adicionado -no-audio e desativado aceleração de hardware que possa conflitar no ambiente virtual padrão
          emulator -avd test_android -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot-save -no-window -qemu -enable-kvm &
          
          echo "Aguardando o emulador iniciar o sistema básico..."
          # Dá um tempo para o adb reconhecer a inicialização em background
          sleep 10
          adb wait-for-device || true
          echo "Emulador pronto e registrado no ADB!"

      - name: Manter Máquina Viva e Monitorar Conexão
        run: |
          # Mostra o IP do Tailscale deste runner para você saber onde conectar
          echo "=========================================================="
          echo "CONECTE VIA RDP NO SEU CLIENTE USANDO O IP DO TAILSCALE ABAIXO:"
          tailscale ip -4
          echo "Usuário: runner"
          echo "Senha: GitHubRDP123"
          echo "=========================================================="
          
          # Loop em puro Bash para manter o workflow online por 5 horas e meia (330 minutos)
          # Evita que a máquina desligue sozinha enquanto você usa o RDP
          for i in {1..330}; do
              echo "Runner ativo e aguardando conexões via Tailscale... (Minuto $i de 330)"
              sleep 60
          done
